name: Hotfix GigaChat upload timeout

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ohdeykbkgimvwstkwuuf
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Download current production function
        run: |
          rm -rf supabase/functions/analyze-pages
          supabase functions download analyze-pages --project-ref "$PROJECT_REF" --use-api
          cp -a supabase/functions/analyze-pages /tmp/analyze-pages-production
      - name: Patch only GigaChat Files API upload timeout
        run: |
          python3 .github/scripts/hotfix_gigachat_upload_timeout.py
          grep -q 'uploadRequestMaxMs: 18_000' supabase/functions/analyze-pages/providers.ts
          grep -q 'signal: AbortSignal = ctrl.signal' supabase/functions/analyze-pages/providers.ts
          grep -q 'api("/files", { method: "POST", body: form }, uploadCtrl.signal)' supabase/functions/analyze-pages/providers.ts
          grep -q 'new ProviderError("AI_TIMEOUT", "upload timeout "' supabase/functions/analyze-pages/providers.ts
      - name: Verify patch is local to providers.ts
        run: |
          test "$(diff -qr /tmp/analyze-pages-production supabase/functions/analyze-pages | wc -l)" -eq 1
          diff -qr /tmp/analyze-pages-production supabase/functions/analyze-pages | grep -q 'providers.ts'
          diff -u /tmp/analyze-pages-production/providers.ts supabase/functions/analyze-pages/providers.ts
        continue-on-error: true
      - name: Reject unexpected changed files
        run: |
          changes="$(diff -qr /tmp/analyze-pages-production supabase/functions/analyze-pages || true)"
          count="$(printf '%s\n' "$changes" | sed '/^$/d' | wc -l)"
          test "$count" -eq 1
          printf '%s\n' "$changes" | grep -q 'providers.ts'
      - name: Deploy patched production bundle
        run: supabase functions deploy analyze-pages --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
      - name: Verify active function
        run: supabase functions list --project-ref "$PROJECT_REF"
