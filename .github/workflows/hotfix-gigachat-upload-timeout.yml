name: Hotfix GigaChat upload timeout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-gigachat-upload-timeout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ohdeykbkgimvwstkwuuf
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Download current production function
        run: |
          rm -rf supabase/functions/analyze-pages
          supabase functions download analyze-pages --project-ref "$PROJECT_REF" --use-api
      - name: Patch only GigaChat Files API upload timeout
        run: |
          python3 .github/scripts/hotfix_gigachat_upload_timeout.py
          grep -q 'uploadMaxMs: 18_000' supabase/functions/analyze-pages/providers.ts
          grep -q 'upload timeout' supabase/functions/analyze-pages/providers.ts
      - name: Deploy patched production bundle
        run: supabase functions deploy analyze-pages --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
      - name: Verify active function
        run: supabase functions list --project-ref "$PROJECT_REF"
