# Проверка скрипта смены ключа на Windows PowerShell 5.1 против локальной заглушки Supabase.
# Настоящий Supabase не вызывается, секретов нет.
name: Rekey script test (mock, no Supabase)

on:
  push:
    branches: [deploy/v66]
    paths: [.github/workflows/rekey-script-test.yml, .github/rekey-test/**]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run scenarios
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .github/rekey-test/run.ps1
