# Временная диагностика: открывает РЕАЛЬНЫЙ production (GitHub Pages) и сохраняет отчёт + скриншоты в ветку.
name: prod-check
on:
  push:
    branches: [claude/dreamy-brahmagupta-8foooq]
    paths: [".github/workflows/prod-check.yml", "tools/prod-check/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: Build legacy localStorage from the previously deployed commit (1125d71)
        run: |
          mkdir -p /tmp/old/konspekt-app && git archive 1125d71 | tar -x -C /tmp/old/konspekt-app
          (cd /tmp/old && python3 -m http.server 8000 >/dev/null 2>&1 &) ; sleep 1
      - run: node tools/prod-check/check.mjs
      - name: Commit results
        run: |
          git config user.name "prod-check" && git config user.email "prod-check@users.noreply.github.com"
          git add prod-check-results && git commit -m "prod-check results $(date -u +%FT%TZ) [skip ci]" && git push
