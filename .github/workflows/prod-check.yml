# Временная проверка production: версии файлов, скриншоты (WebKit) и покадровый тест мигания.
name: prod-check
on:
  push:
    branches: [claude/dreamy-brahmagupta-8foooq]
    paths: [".github/workflows/prod-check.yml", "tools/prod-check/**"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps webkit chromium
      - name: Wait until production serves v=26
        run: |
          for i in $(seq 1 60); do curl -s https://thenikolaika1.github.io/konspekt-app/index.html | grep -q "v=26" && echo "v26 live" && exit 0; sleep 10; done; echo "v26 NOT live"; exit 1
      - run: node tools/prod-check/screens.mjs
      - name: Flicker probe on production
        run: |
          for E in webkit chromium; do node tools/prod-check/flicker.mjs https://thenikolaika1.github.io/konspekt-app/ $E | tee -a prod-check-results/flicker.txt; done
      - name: Commit results
        run: |
          git config user.name "prod-check" && git config user.email "prod-check@users.noreply.github.com"
          git add prod-check-results && git commit -m "prod-check results $(date -u +%FT%TZ) [skip ci]" && git push
