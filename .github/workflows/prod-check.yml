# Временная проверка production: движение, листы, подмена иконок (WebKit и Chromium).
name: prod-check
on:
  push:
    branches: [claude/dreamy-brahmagupta-8foooq]
    paths: [".github/workflows/prod-check.yml", "tools/prod-check/**"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps webkit chromium
      - name: Wait until production serves v=30
        run: |
          for i in $(seq 1 60); do curl -s https://thenikolaika1.github.io/konspekt-app/index.html | grep -q "v=30" && echo "v29 live" && exit 0; sleep 10; done; echo "v29 NOT live"; exit 1
      - name: Checks
        run: |
          mkdir -p prod-check-results
          U=https://thenikolaika1.github.io/konspekt-app/
          { echo "== files"; curl -s $U/index.html | grep -o 'v=30' | head -1; curl -s "$U/service-worker.js" | grep -o 'konspekt-v30'; curl -s "$U/app.js?v=30" | grep -c 'function dragMove\|function animateScreens\|function closeOverlay'; curl -s "$U/styles.css?v=30" | grep -c 'MOTION\|--motion-sheet\|sheet-in'; } | tee prod-check-results/report.txt
          echo "== motion QA (Chromium, touch)" | tee -a prod-check-results/report.txt
          node tools/prod-check/motionqa.cjs $U | tee -a prod-check-results/report.txt
          echo "== sheet (WebKit, pointer)" | tee -a prod-check-results/report.txt
          node tools/prod-check/sheetmouse.mjs $U | tee -a prod-check-results/report.txt
          echo "== icon swaps" | tee -a prod-check-results/report.txt
          for E in webkit chromium; do node tools/prod-check/flicker.mjs $U $E | tee -a prod-check-results/report.txt; done
      - name: Commit results
        run: |
          git config user.name "prod-check" && git config user.email "prod-check@users.noreply.github.com"
          git add prod-check-results && git commit -m "prod-check results $(date -u +%FT%TZ) [skip ci]" && git push
