<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="bg" cx=".35" cy=".3" r=".95">
      <stop offset="0" stop-color="#2f63f0"/>
      <stop offset=".6" stop-color="#1c3cc4"/>
      <stop offset="1" stop-color="#14238a"/>
    </radialGradient>
    <radialGradient id="violet" cx="1" cy="0" r=".75">
      <stop offset="0" stop-color="#8a5cf6" stop-opacity=".85"/>
      <stop offset="1" stop-color="#8a5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="heat" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset=".3" stop-color="#ffb347"/>
      <stop offset=".62" stop-color="#ff7a1f" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ff7a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bcd6ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#e6f0ff" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="trailW" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffd48a" stop-opacity=".95"/>
    </linearGradient>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <rect width="120" height="120" fill="url(#violet)"/>
  <circle cx="60" cy="64" r="38" fill="url(#heat)"/>
  <!-- орбиты движения частиц -->
  <g fill="none" stroke="#cfe0ff" stroke-width="1" opacity=".35">
    <ellipse cx="60" cy="64" rx="44" ry="17" transform="rotate(-24 60 64)"/>
    <ellipse cx="60" cy="64" rx="44" ry="17" transform="rotate(34 60 64)"/>
  </g>
  <!-- частицы со шлейфами -->
  <g>
    <rect x="8" y="27.5" width="26" height="5" rx="2.5" fill="url(#trail)"/>
    <rect x="76" y="20" width="25" height="4" rx="2" fill="url(#trail)"/>
    <rect x="4" y="94" width="28" height="4" rx="2" fill="url(#trail)"/>
    <rect x="66" y="97.5" width="32" height="5" rx="2.5" fill="url(#trailW)"/>
    <rect x="32" y="58" width="18" height="4" rx="2" fill="url(#trailW)"/>
  </g>
  <g>
    <circle cx="34" cy="30" r="5.5" fill="#e9f1ff"/>
    <circle cx="101" cy="22" r="4.5" fill="#e9f1ff"/>
    <circle cx="32" cy="96" r="4.5" fill="#d6e4ff"/>
    <circle cx="98" cy="100" r="5.5" fill="#ffd48a"/>
    <circle cx="50" cy="60" r="4.5" fill="#ffe2a8"/>
    <circle cx="60" cy="64" r="9" fill="#fff6e2"/>
    <circle cx="57" cy="61" r="3" fill="#fff"/>
    <circle cx="96" cy="58" r="3" fill="#b99bff"/>
    <circle cx="20" cy="66" r="2.4" fill="#b8ceff"/>
  </g>
