# nginx на VPS (Россия или зарубежная площадка, доступная из России): прозрачный прокси к Supabase.
# Без лимита на размер ответа (в отличие от API Gateway). Нужны домен и TLS-сертификат (Let's Encrypt).
# Журнал запросов выключен: в адресах и заголовках есть токены, их нельзя сохранять.
server {
    listen 443 ssl;
    http2 on;
    server_name api.example.ru;                       # ← свой домен

    ssl_certificate     /etc/letsencrypt/live/api.example.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.ru/privkey.pem;

    access_log off;
    client_max_body_size 10m;

    location / {
        proxy_pass https://ohdeykbkgimvwstkwuuf.supabase.co;
        proxy_set_header Host ohdeykbkgimvwstkwuuf.supabase.co;
        proxy_ssl_server_name on;
        proxy_ssl_name ohdeykbkgimvwstkwuuf.supabase.co;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
